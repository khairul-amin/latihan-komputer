<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Mouse + Timer</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
}
#info {
  background: #f8f9fa;
  padding: 10px;
  font-size: 18px;
  border-bottom: 1px solid #ccc;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}
#timer { font-weight: bold; }
canvas { flex-grow: 1; background: #f0f0f0; }
#summary { display:none; padding:20px; }
table { width:100%; border-collapse:collapse; }
td,th { border:1px solid #ccc; padding:8px; text-align:center; }
.good{color:green;font-weight:bold}
.bad{color:red;font-weight:bold}
</style>
</head>

<body>

<div id="info">
  <div>Stage: <span id="stage">1</span></div>
  <div>Target: <span id="currentTarget">1</span> / <span id="targetCount">30</span></div>
  <div id="timer">⏱ 0.0s</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="summary">
  <h2>📊 Rekap Latihan Mouse</h2>
  <table>
    <thead>
      <tr>
        <th>Stage</th><th>Latihan</th><th>Waktu</th><th>Status</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight - document.getElementById('info').offsetHeight;

let stage=1,targetCount=2,currentTarget=0,isProcessing=false;
let dragging=false, dragOffset={x:0,y:0};
let scrollVal=0;

// ===== DRAG & DROP =====
let dropZone=null;
let snapping=false;

// ===== SELEKSI AREA =====
let selectStart=null, selectRect=null;
let selectBoxes=[];

// ===== WARNA =====
const stageColors={
  1:'#e74c3c',2:'#3498db',3:'#27ae60',
  4:'#9b59b6',5:'#f39c12',
  8:'#2c3e50',9:'#34495e'
};

// ===== TIMER =====
let stageStart=Date.now(), timerInterval;
const stageTimeLimit={1:20,2:25,3:25,4:30,5:40,8:20,9:45};
const stageNames={
  1:'Sorot',2:'Klik kiri',3:'Klik kanan',
  4:'Double click',5:'Drag & Drop',
  8:'Scroll',9:'Seleksi Area'
};
let summary=[];

function startTimer(){
  stageStart=Date.now();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    const t=((Date.now()-stageStart)/1000).toFixed(1);
    timerEl.textContent=`⏱ ${t}s`;
    timerEl.style.color=t<=stageTimeLimit[stage]?'green':'red';
  },100);
}
function stopTimer(){
  clearInterval(timerInterval);
  const t=((Date.now()-stageStart)/1000).toFixed(1);
  summary.push({stage,name:stageNames[stage],time:t,ok:t<=stageTimeLimit[stage]});
}

// ===== UTIL =====
function randPos(w=170,h=60){
  return {
    x:Math.random()*(canvas.width-w-40)+20,
    y:Math.random()*(canvas.height-h-40)+20,
    w,h
  };
}
function hit(e,o){
  return e.offsetX>=o.x&&e.offsetX<=o.x+o.w&&
         e.offsetY>=o.y&&e.offsetY<=o.y+o.h;
}

// ===== INIT SELEKSI (GRID) =====
  // ===== TARGET SELEKSI BERTAHAP =====
const selectTargets = [
  { from:'A1',  to:'C3',  min:9 },
  { from:'D4',  to:'F6',  min:9 },
  { from:'A6',  to:'E9',  min:20 },
  { from:'C2',  to:'H5',  min:18 },
  { from:'B7',  to:'J10', min:24 }
];

let selectStep = 0;

function initSelectStage(){
  selectBoxes=[];
  selectStep = 0;

  const cols=10;
  const rows=10;
  const size=48;
  const gap=8;

  const gridW = cols*size+(cols-1)*gap;
  const gridH = rows*size+(rows-1)*gap;

  const startX=(canvas.width-gridW)/2;
  const startY=(canvas.height-gridH)/2;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      selectBoxes.push({
        x:startX+c*(size+gap),
        y:startY+r*(size+gap),
        w:size,
        h:size,
        label:String.fromCharCode(65+r)+(c+1),
        selected:false
      });
    }
  }
}


// ===== SNAP ANIM =====
function snapToDrop(){
  snapping=true;
  const tx=dropZone.x+(dropZone.w-target.w)/2;
  const ty=dropZone.y+(dropZone.h-target.h)/2;

  function anim(){
    target.x+=(tx-target.x)*0.25;
    target.y+=(ty-target.y)*0.25;
    draw();
    if(Math.abs(target.x-tx)<1&&Math.abs(target.y-ty)<1){
      snapping=false;
      next();
      return;
    }
    requestAnimationFrame(anim);
  }
  anim();
}

// ===== DRAW =====
let target;
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ===== STAGE 9: SELEKSI =====
  if(stage===9){
const t = selectTargets[selectStep];

ctx.fillStyle='#2c3e50';
ctx.font='bold 20px Arial';
ctx.textAlign='center';
ctx.fillText(
  `Seleksi dari ${t.from} ke ${t.to} (min. ${t.min} blok)`,
  canvas.width/2,32
);

ctx.font='16px Arial';
ctx.fillText(
  'Klik + drag untuk memblok area secara presisi',
  canvas.width/2,54
);

    return;
  }

  // ===== DROP ZONE =====
  if(stage===5 && dropZone){
    ctx.strokeStyle='#27ae60';
    ctx.lineWidth=3;
    ctx.strokeRect(dropZone.x,dropZone.y,dropZone.w,dropZone.h);
  }

  // ===== TARGET =====
  ctx.fillStyle=stageColors[stage];
  ctx.fillRect(target.x,target.y,target.w,target.h);

  ctx.fillStyle='#fff';
  ctx.font='bold 24px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(stageNames[stage],target.x+target.w/2,target.y+target.h/2);

  document.getElementById('stage').textContent=stage;
  document.getElementById('currentTarget').textContent=currentTarget+1;
  document.getElementById('targetCount').textContent=targetCount;
}

// ===== FLOW =====
function next(){
  if(isProcessing)return;
  isProcessing=true;
  setTimeout(()=>{
    currentTarget++;
    if(currentTarget>=targetCount){
      stopTimer();
      stage++;
      currentTarget=0;
      if(stage===6||stage===7)stage=8;
      if(stage>9){showSummary();return;}
      startTimer();
    }
    if(stage===9) initSelectStage();
    else{
      target=randPos();
      if(stage===5) dropZone=randPos(240,90);
    }
    isProcessing=false;
    draw();
  },300);
}

// ===== EVENTS =====
canvas.addEventListener('mousedown',e=>{
  if(stage===5 && hit(e,target)){
    dragging=true;
    dragOffset.x=e.offsetX-target.x;
    dragOffset.y=e.offsetY-target.y;
  }
  if(stage===9){
    selectStart={x:e.offsetX,y:e.offsetY};
    selectRect=null;
  }
});

canvas.addEventListener('mousemove',e=>{
  if(stage===5 && dragging && !snapping){
    target.x=e.offsetX-dragOffset.x;
    target.y=e.offsetY-dragOffset.y;
    draw();
  }
if(stage===9 && selectStart){
  const x=Math.min(selectStart.x,e.offsetX);
  const y=Math.min(selectStart.y,e.offsetY);
  const w=Math.abs(e.offsetX-selectStart.x);
  const h=Math.abs(e.offsetY-selectStart.y);
  selectRect={x,y,w,h};

  selectBoxes.forEach(b=>{
    const ox = Math.max(0,
      Math.min(b.x+b.w,x+w)-Math.max(b.x,x)
    );
    const oy = Math.max(0,
      Math.min(b.y+b.h,y+h)-Math.max(b.y,y)
    );
    const overlap = ox*oy;
    b.selected = overlap/(b.w*b.h) >= 0.5;
  });

  draw();
}

});

canvas.addEventListener('mouseup',()=>{
  if(stage===5 && dragging){
    dragging=false;
    const cx=target.x+target.w/2;
    const cy=target.y+target.h/2;
    if(
      cx>dropZone.x&&cx<dropZone.x+dropZone.w&&
      cy>dropZone.y&&cy<dropZone.y+dropZone.h
    ){
      snapToDrop();
    }
  }
if(stage===9 && selectRect){
  const t = selectTargets[selectStep];
  const count = selectBoxes.filter(b=>b.selected).length;

  if(count >= t.min){
    selectStep++;
    currentTarget++;

    selectBoxes.forEach(b=>b.selected=false);

    if(selectStep >= selectTargets.length){
      next(); // lanjut stage berikutnya
    }
  }

  selectStart=null;
  selectRect=null;
  draw();
}

});

canvas.addEventListener('mousemove',e=>{
  if(stage===1&&hit(e,target))next();
});
canvas.addEventListener('click',e=>{
  if(stage===2&&hit(e,target))next();
});
canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(stage===3&&hit(e,target))next();
});
canvas.addEventListener('dblclick',e=>{
  if(stage===4&&hit(e,target))next();
});
canvas.addEventListener('wheel',e=>{
  if(stage===8){
    scrollVal+=Math.abs(e.deltaY);
    if(scrollVal>600)next();
  }
});

// ===== SUMMARY =====
function showSummary(){
  canvas.style.display='none';
  document.getElementById('info').style.display='none';
  document.getElementById('summary').style.display='block';
  const tbody=document.getElementById('summaryBody');
  summary.forEach(s=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${s.stage}</td>
      <td>${s.name}</td>
      <td>${s.time}s</td>
      <td class="${s.ok?'good':'bad'}">${s.ok?'NORMAL':'LAMBAT'}</td>`;
    tbody.appendChild(tr);
  });
}

// INIT
target=randPos();
startTimer();
draw();
</script>

</body>
</html>
