<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latihan Mouse - Drag & Drop</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
#info {
  background: #f8f9fa;
  padding: 10px;
}
canvas {
  display: block;
  background: #f0f0f0;
}
</style>
</head>
<body>

<div id="info">
  Stage: <span id="stage">5</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 50;

let stage = 5;

// ===== TARGET =====
let target = { x: 100, y: 100, w: 160, h: 50 };

// ===== DROP ZONE =====
let dropZone = { x: 400, y: 200, w: 220, h: 120 };

// ===== DRAG STATE =====
let dragging = false;
let offsetX = 0;
let offsetY = 0;

// ===== RANDOM SEMUA =====
function randomizeAll() {
  target.x = Math.random() * (canvas.width - 200);
  target.y = Math.random() * (canvas.height - 150);

  dropZone.x = Math.random() * (canvas.width - 300);
  dropZone.y = Math.random() * (canvas.height - 200);
}

// ===== HIT TEST =====
function hit(e, obj) {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  return x >= obj.x && x <= obj.x + obj.w &&
         y >= obj.y && y <= obj.y + obj.h;
}

// ===== DRAW =====
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // DROP ZONE
  ctx.fillStyle = "#ddd";
  ctx.fillRect(dropZone.x, dropZone.y, dropZone.w, dropZone.h);
  ctx.strokeRect(dropZone.x, dropZone.y, dropZone.w, dropZone.h);
  ctx.fillStyle = "#555";
  ctx.textAlign = "center";
  ctx.fillText("DROP DI SINI",
    dropZone.x + dropZone.w/2,
    dropZone.y + dropZone.h/2
  );

  // SHADOW + TRANSPARAN
  if (dragging) {
    ctx.globalAlpha = 0.7;
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 15;
  } else {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // TARGET
  ctx.fillStyle = "#007bff";
  ctx.fillRect(target.x, target.y, target.w, target.h);
  ctx.fillStyle = "#fff";
  ctx.fillText("Drag ke kotak",
    target.x + target.w/2,
    target.y + target.h/2
  );

  ctx.globalAlpha = 1;
}

// ===== EVENTS =====
canvas.addEventListener("mousedown", e => {
  if (hit(e, target)) {
    dragging = true;
    const r = canvas.getBoundingClientRect();
    offsetX = (e.clientX - r.left) - target.x;
    offsetY = (e.clientY - r.top) - target.y;
  }
});

canvas.addEventListener("mousemove", e => {
  if (!dragging) return;
  const r = canvas.getBoundingClientRect();
  target.x = e.clientX - r.left - offsetX;
  target.y = e.clientY - r.top - offsetY;
  draw();
});

canvas.addEventListener("mouseup", () => {
  if (!dragging) return;
  dragging = false;

  // ===== CEK BERHASIL =====
  const success =
    target.x > dropZone.x &&
    target.x + target.w < dropZone.x + dropZone.w &&
    target.y > dropZone.y &&
    target.y + target.h < dropZone.y + dropZone.h;

  if (success) {
    // SNAP KE TENGAH
    target.x = dropZone.x + (dropZone.w - target.w) / 2;
    target.y = dropZone.y + (dropZone.h - target.h) / 2;
    draw();

    // TUNGGU SEBENTAR → PINDAH SEMUA
    setTimeout(() => {
      randomizeAll();
      draw();
    }, 500);
  }

  draw();
});

// INIT
randomizeAll();
draw();
</script>

</body>
</html>
