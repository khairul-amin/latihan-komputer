<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Mouse + Timer</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
}
#info {
  background: #f8f9fa;
  padding: 14px;
  font-size: 22px;
  border-bottom: 1px solid #ccc;
  display: flex;
  justify-content: space-between;
}
#timer { font-weight: bold; }

canvas { flex-grow: 1; background: #f0f0f0; }

.bigText {
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="info">
  <div>Stage: <span id="stage">1</span></div>
  <div>Target: <span id="currentTarget">1</span>/30</div>
  <div id="timer">⏱ 0.0s</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - info.offsetHeight;

let stage=5; // langsung test stage penting
let currentTarget=0;
let dragging=false;
let dragOffset={x:0,y:0};
let selectStart=null;
let selectRect=null;

let target = {x:100,y:100,w:120,h:60};
let startPos = {...target};

let slots = [];
let slotIndex = 0;

// ==== DRAW ====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // STAGE 7 SLOT
  if(stage===7){
    slots.forEach((s,i)=>{
      ctx.strokeStyle=i===slotIndex?'green':'#aaa';
      ctx.lineWidth=3;
      ctx.strokeRect(s.x,s.y,s.w,s.h);
    });
  }

  // SELEKSI AREA
  if(stage===9 && selectRect){
    ctx.fillStyle='rgba(0,123,255,0.2)';
    ctx.fillRect(
      selectRect.x,
      selectRect.y,
      selectRect.w,
      selectRect.h
    );
    ctx.strokeStyle='blue';
    ctx.strokeRect(
      selectRect.x,
      selectRect.y,
      selectRect.w,
      selectRect.h
    );
  }

  // TARGET
  ctx.fillStyle='#3498db';
  ctx.fillRect(target.x,target.y,target.w,target.h);
  ctx.fillStyle='#fff';
  ctx.font='22px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(
    stage===6?'GESER KOTAK':
    stage===7?'SUSUN KE SLOT':
    stage===9?'SELEKSI INI':'',
    target.x+target.w/2,
    target.y+target.h/2
  );
}

// ==== EVENTS ====
canvas.onmousedown=e=>{
  if(hit(e,target)){
    dragging=true;
    dragOffset.x=e.offsetX-target.x;
    dragOffset.y=e.offsetY-target.y;
  }
  if(stage===9){
    selectStart={x:e.offsetX,y:e.offsetY};
    selectRect=null;
  }
};

canvas.onmousemove=e=>{
  if(dragging){
    target.x=e.offsetX-dragOffset.x;
    target.y=e.offsetY-dragOffset.y;
    draw();
  }
  if(stage===9 && selectStart){
    selectRect={
      x:Math.min(selectStart.x,e.offsetX),
      y:Math.min(selectStart.y,e.offsetY),
      w:Math.abs(e.offsetX-selectStart.x),
      h:Math.abs(e.offsetY-selectStart.y)
    };
    draw();
  }
};

canvas.onmouseup=e=>{
  dragging=false;

  // STAGE 6: PINDAH JARAK
  if(stage===6){
    const dx=Math.abs(target.x-startPos.x);
    if(dx>200){
      alert('✔ Pindah cukup jauh');
    }
  }

  // STAGE 7: SLOT URUT
  if(stage===7){
    const s=slots[slotIndex];
    if(
      target.x>s.x && target.x+target.w<s.x+s.w &&
      target.y>s.y && target.y+target.h<s.y+s.h
    ){
      target.x=s.x+10;
      target.y=s.y+10;
      slotIndex++;
      if(slotIndex>=slots.length) alert('✔ Semua slot terisi');
    }
  }

  // STAGE 9: SELEKSI
  if(stage===9 && selectRect){
    if(
      target.x>=selectRect.x &&
      target.y>=selectRect.y &&
      target.x+target.w<=selectRect.x+selectRect.w &&
      target.y+target.h<=selectRect.y+selectRect.h
    ){
      alert('✔ Seleksi berhasil');
    }
    selectRect=null;
    draw();
  }
};

function hit(e,o){
  return e.offsetX>=o.x&&e.offsetX<=o.x+o.w&&
         e.offsetY>=o.y&&e.offsetY<=o.y+o.h;
}

// INIT SLOT
for(let i=0;i<3;i++){
  slots.push({x:300+i*160,y:100,w:140,h:80});
}

draw();
</script>

</body>
</html>
