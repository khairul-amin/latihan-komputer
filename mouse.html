<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Menggunakan Mouse</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    #info {
      background-color: #f8f9fa;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border-bottom: 1px solid #ccc;
    }

    canvas {
      display: block;
      background-color: #f0f0f0;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<div id="info">
  <div>Stage: <span id="stage">1</span></div>
  <div>Target: <span id="currentTarget">1</span> / <span id="targetCount">20</span></div>
  <a href="/#!/login">KLIK INI UNTUK KEMBALI KE BERANDA</a>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const infoHeight = document.getElementById('info').offsetHeight;
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - infoHeight;

const stageElement = document.getElementById('stage');
const currentTargetElement = document.getElementById('currentTarget');
const targetCountElement = document.getElementById('targetCount');

let stage = 1;
let targetCount = 20;
let currentTarget = 0;
let targetPosition = getRandomPosition();
let isProcessing = false;

function getRandomPosition() {
  return {
    x: Math.random() * (canvas.width - 200) + 50,
    y: Math.random() * (canvas.height - 100) + 50
  };
}

function drawTarget() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let label = '';
  let color = '';

  if (stage === 1) {
    label = 'Sorot ini';
    color = 'red';
  } else if (stage === 2) {
    label = 'Klik kiri';
    color = 'blue';
  } else if (stage === 3) {
    label = 'Klik kanan';
    color = 'green';
  }

  ctx.fillStyle = color;
  ctx.fillRect(targetPosition.x, targetPosition.y, 160, 50);

  ctx.fillStyle = 'white';
  ctx.font = '20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, targetPosition.x + 80, targetPosition.y + 25);

  stageElement.textContent = stage;
  currentTargetElement.textContent = currentTarget + 1;
  targetCountElement.textContent = targetCount;
}

// STAGE 1: HOVER
canvas.addEventListener('mousemove', e => {
  if (stage !== 1 || isProcessing) return;

  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  if (x >= targetPosition.x && x <= targetPosition.x + 160 &&
      y >= targetPosition.y && y <= targetPosition.y + 50) {

    isProcessing = true;
    setTimeout(() => {
      nextTarget();
    }, 300);
  }
});

// STAGE 2: KLIK KIRI
canvas.addEventListener('click', e => {
  if (stage !== 2 || isProcessing) return;

  if (isHit(e)) {
    isProcessing = true;
    setTimeout(() => {
      nextTarget();
    }, 300);
  }
});

// STAGE 3: KLIK KANAN
canvas.addEventListener('contextmenu', e => {
  e.preventDefault(); // ⛔ matikan menu browser
  if (stage !== 3 || isProcessing) return;

  if (isHit(e)) {
    isProcessing = true;
    setTimeout(() => {
      nextTarget();
    }, 300);
  }
});

function isHit(e) {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  return (
    x >= targetPosition.x &&
    x <= targetPosition.x + 160 &&
    y >= targetPosition.y &&
    y <= targetPosition.y + 50
  );
}

function nextTarget() {
  currentTarget++;

  if (currentTarget < targetCount) {
    targetPosition = getRandomPosition();
  } else {
    if (stage < 3) {
      stage++;
      currentTarget = 0;
    } else {
      alert('🎉 Selamat! Anda telah menyelesaikan latihan mouse');
      stage = 1;
      currentTarget = 0;
    }
    targetPosition = getRandomPosition();
  }

  isProcessing = false;
  drawTarget();
}

drawTarget();
</script>

</body>
</html>
