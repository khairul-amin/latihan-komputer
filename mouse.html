<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latihan Mouse + Timer</title>
<style>
body{margin:0;font-family:Arial}
#info{background:#f8f9fa;padding:10px;font-size:18px;
display:flex;justify-content:space-between;border-bottom:1px solid #ccc}
#timer{font-weight:bold}
#fail{color:red;font-weight:bold}
canvas{display:block;background:#f0f0f0}
</style>
</head>

<body>

<div id="info">
  <div>Stage: <span id="stage">1</span></div>
  <div>Target: <span id="cur">1</span>/5</div>
  <div id="timer">⏱ 0.0s</div>
  <div id="fail" style="display:none">❌ Gagal: 0</div>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=innerWidth;
c.height=innerHeight-info.offsetHeight;

let stage=2,targetCount=2,cur=0;
let target,dropZone;
let dragging=false,off={x:0,y:0};
let fail=0;

// ===== SELEKSI =====
let boxes=[],selectStart=null,selectRect=null;

// ===== TIMER =====
let start=Date.now(),timer=setInterval(tick,100);
function tick(){
  let t=((Date.now()-start)/1000).toFixed(1);
  timerEl.textContent='⏱ '+t+'s';
}
function next(){
  cur++;
  if(cur>=targetCount){alert('SELESAI');return;}
  randomize();
  draw();
}

// ===== UTIL =====
function rand(w=170,h=60){
  return {x:Math.random()*(c.width-w-40)+20,
          y:Math.random()*(c.height-h-40)+20,w,h};
}
function hit(e,o){
  return e.offsetX>=o.x&&e.offsetX<=o.x+o.w&&
         e.offsetY>=o.y&&e.offsetY<=o.y+o.h;
}
function intersect(a,b){
  return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);
}

// ===== INIT =====
function randomize(){
  target=rand();
  dropZone=rand(220,110);
  fail=0;failEl.style.display='block';
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  if(stage===5){
    ctx.strokeStyle='green';
    ctx.lineWidth=3;
    ctx.strokeRect(dropZone.x,dropZone.y,dropZone.w,dropZone.h);
    ctx.fillStyle='green';
    ctx.font='bold 18px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('DROP',
      dropZone.x+dropZone.w/2,
      dropZone.y+dropZone.h/2);
  }

  if(stage===7){
    boxes.forEach(b=>{
      ctx.fillStyle=b.sel?'#2ecc71':'#3498db';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeRect(b.x,b.y,b.w,b.h);
    });
    if(selectRect){
      ctx.fillStyle='rgba(52,152,219,.25)';
      ctx.fillRect(selectRect.x,selectRect.y,selectRect.w,selectRect.h);
      ctx.strokeRect(selectRect.x,selectRect.y,selectRect.w,selectRect.h);
    }
    return;
  }

  ctx.fillStyle='#f39c12';
  ctx.fillRect(target.x,target.y,target.w,target.h);
}

// ===== EVENTS =====
c.onmousedown=e=>{
  if(stage===5 && hit(e,target)){
    dragging=true;
    off.x=e.offsetX-target.x;
    off.y=e.offsetY-target.y;
  }

  if(stage===7){
    selectStart={x:e.offsetX,y:e.offsetY};
    selectRect=null;
  }
};

c.onmousemove=e=>{
  if(stage===5 && dragging){
    target.x=e.offsetX-off.x;
    target.y=e.offsetY-off.y;
    draw();
  }

  if(stage===7 && selectStart){
    const x=Math.min(selectStart.x,e.offsetX);
    const y=Math.min(selectStart.y,e.offsetY);
    const w=Math.abs(e.offsetX-selectStart.x);
    const h=Math.abs(e.offsetY-selectStart.y);
    selectRect={x,y,w,h};
    boxes.forEach(b=>b.sel=intersect(selectRect,b));
    draw();
  }
};

c.onmouseup=e=>{
  if(stage===5 && dragging){
    dragging=false;
    const ok=
      target.x>dropZone.x &&
      target.x+target.w<dropZone.x+dropZone.w &&
      target.y>dropZone.y &&
      target.y+target.h<dropZone.y+dropZone.h;

    ok?next():(fail++,failEl.textContent='❌ Gagal: '+fail);
  }

  if(stage===7 && selectRect){
    if(boxes.filter(b=>b.sel).length>=3)next();
    selectStart=null;
    selectRect=null;
    draw();
  }
};

// ===== START =====
randomize();
draw();
</script>

</body>
</html>
