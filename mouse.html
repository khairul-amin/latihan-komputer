<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Latihan Seleksi Area (Klik + Drag)</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
#info {
  background: #f8f9fa;
  padding: 10px;
  font-size: 18px;
  border-bottom: 1px solid #ccc;
}
canvas {
  display: block;
  background: #f0f0f0;
}
</style>
</head>

<body>

<div id="info">
  🖱️ Latihan Seleksi Area — Blok minimal <b>3 kotak</b>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight - document.getElementById('info').offsetHeight;

// ===== DATA =====
const BOX_COUNT = 8;
const boxes = [];
let selectStart = null;
let selectRect = null;

// ===== INIT BOX =====
for(let i=0;i<BOX_COUNT;i++){
  boxes.push({
    x: Math.random() * (canvas.width - 100) + 50,
    y: Math.random() * (canvas.height - 100) + 50,
    w: 70,
    h: 50,
    selected: false
  });
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // draw boxes
  boxes.forEach(b=>{
    ctx.fillStyle = b.selected ? '#2ecc71' : '#3498db';
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.strokeStyle = '#333';
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle='#fff';
    ctx.font='bold 16px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('OBJ',
      b.x+b.w/2,
      b.y+b.h/2
    );
  });

  // draw selection area
  if(selectRect){
    ctx.fillStyle = 'rgba(52,152,219,0.25)';
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 2;
    ctx.fillRect(selectRect.x,selectRect.y,selectRect.w,selectRect.h);
    ctx.strokeRect(selectRect.x,selectRect.y,selectRect.w,selectRect.h);
  }
}

// ===== UTIL =====
function rectIntersect(a,b){
  return !(
    a.x+a.w < b.x ||
    a.x > b.x+b.w ||
    a.y+a.h < b.y ||
    a.y > b.y+b.h
  );
}

// ===== EVENTS =====
canvas.addEventListener('mousedown',e=>{
  selectStart = {x:e.offsetX,y:e.offsetY};
  selectRect = null;
});

canvas.addEventListener('mousemove',e=>{
  if(!selectStart) return;

  const x = Math.min(selectStart.x,e.offsetX);
  const y = Math.min(selectStart.y,e.offsetY);
  const w = Math.abs(e.offsetX-selectStart.x);
  const h = Math.abs(e.offsetY-selectStart.y);

  selectRect = {x,y,w,h};

  // reset selection
  boxes.forEach(b=>b.selected=false);

  // cek box masuk area
  boxes.forEach(b=>{
    if(rectIntersect(selectRect,b)){
      b.selected = true;
    }
  });

  draw();
});

canvas.addEventListener('mouseup',()=>{
  if(!selectRect) return;

  const selectedCount = boxes.filter(b=>b.selected).length;

  if(selectedCount >= 3){
    alert('✅ Berhasil! '+selectedCount+' objek terseleksi');
  } else {
    alert('❌ Minimal seleksi 3 objek');
    boxes.forEach(b=>b.selected=false);
  }

  selectStart = null;
  selectRect = null;
  draw();
});

// INIT
draw();
</script>

</body>
</html>
