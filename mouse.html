<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latihan Mouse + Timer</title>
<style>
body{margin:0;display:flex;flex-direction:column;font-family:Arial}
#info{background:#f8f9fa;padding:10px;font-size:18px;border-bottom:1px solid #ccc;display:flex;justify-content:space-between}
canvas{flex-grow:1;background:#f0f0f0}
#summary{display:none;padding:20px}
.good{color:green;font-weight:bold}
.bad{color:red;font-weight:bold}
</style>
</head>
<body>

<div id="info">
  <div>Stage: <span id="stage">1</span></div>
  <div>Target: <span id="currentTarget">1</span> / <span id="targetCount">5</span></div>
  <div id="timer">⏱ 0.0s</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="summary">
  <h2>📊 Rekap</h2>
  <table border="1" width="100%">
    <tbody id="summaryBody"></tbody>
  </table>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;
canvas.height=innerHeight-60;

let stage=1;
let targetCount=3;
let currentTarget=0;
let isProcessing=false;

let target;
let dropZone=null;
let scrollVal=0;

// ===== TIMER =====
let stageStart=Date.now(), timerInterval;
const timePerStage={1:2,2:2,3:2,4:1.5,5:3,8:2,9:6};
const tolerance=0.3;
const summary=[];

function startTimer(){
  stageStart=Date.now();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    const t=((Date.now()-stageStart)/1000).toFixed(1);
    document.getElementById('timer').textContent=`⏱ ${t}s`;
  },100);
}

function stopTimer(){
  clearInterval(timerInterval);
  const t=((Date.now()-stageStart)/1000);
  summary.push({stage,time:t.toFixed(1)});
}

// ===== UTIL =====
function randPos(w=170,h=60){
  return {x:Math.random()*(canvas.width-w-40)+20,
          y:Math.random()*(canvas.height-h-40)+20,w,h};
}

// ===== STAGE FLOW =====
function nextTarget(){
  currentTarget++;
  if(currentTarget>=targetCount){
    nextStage();
  }else{
    target=randPos();
    draw();
  }
}

function nextStage(){
  stopTimer();
  stage++;
  currentTarget=0;

  if(stage===6||stage===7)stage=8;
  if(stage>9){showSummary();return;}

  if(stage===9){
    initSelectStage();
  }else{
    target=randPos();
    if(stage===5)dropZone=randPos(240,90);
  }

  startTimer();
  draw();
}

// ===== SELEKSI AREA (STAGE 9) =====
let selectBoxes=[],selectTargets=[],selectStep=0;
let selectStart=null,selectRect=null,gridArea=null;

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function cellLabel(r,c){return String.fromCharCode(65+r)+(c+1)}

function generateSelectTargets(n){
  const arr=[];
  for(let i=0;i<n;i++){
    let r1=randInt(0,7),c1=randInt(0,7);
    let r2=r1+randInt(1,3),c2=c1+randInt(1,3);
    arr.push({r1,c1,r2,c2,from:cellLabel(r1,c1),to:cellLabel(r2,c2),min:2});
  }
  return arr;
}

function initSelectStage(){
  selectBoxes=[];
  selectStep=0;
  selectTargets=generateSelectTargets(targetCount);

  const size=36,gap=6;
  const startX=(canvas.width-(10*size+9*gap))/2;
  const startY=120;

  gridArea={x:startX,y:startY,w:10*size+9*gap,h:10*size+9*gap};

  for(let r=0;r<10;r++){
    for(let c=0;c<10;c++){
      selectBoxes.push({
        x:startX+c*(size+gap),
        y:startY+r*(size+gap),
        w:size,h:size,row:r,col:c,selected:false,label:cellLabel(r,c)
      });
    }
  }
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('stage').textContent=stage;

  if(stage===9){
    const t=selectTargets[selectStep];
    ctx.font='18px Arial';
    ctx.textAlign='center';
    ctx.fillText(`Seleksi dari ${t.from} ke ${t.to}`,canvas.width/2,40);

    selectBoxes.forEach(b=>{
      ctx.fillStyle=b.selected?'#3498db':'#ecf0f1';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='#000';
      ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);
    });
    return;
  }

  ctx.fillStyle='#3498db';
  ctx.fillRect(target.x,target.y,target.w,target.h);
  document.getElementById('currentTarget').textContent=currentTarget+1;
  document.getElementById('targetCount').textContent=targetCount;
}

// ===== EVENTS =====
canvas.addEventListener('mousemove',e=>{
  if(stage===1)nextTarget();
});

canvas.addEventListener('click',e=>{
  if(stage===2)nextTarget();
});

canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(stage===3)nextTarget();
});

canvas.addEventListener('dblclick',e=>{
  if(stage===4)nextTarget();
});

canvas.addEventListener('wheel',e=>{
  if(stage===8){
    scrollVal+=Math.abs(e.deltaY);
    if(scrollVal>600){
      scrollVal=0;
      nextStage();
    }
  }
});

canvas.addEventListener('mousedown',e=>{
  if(stage===9){
    if(e.offsetX<gridArea.x||e.offsetX>gridArea.x+gridArea.w||
       e.offsetY<gridArea.y||e.offsetY>gridArea.y+gridArea.h)return;
    selectStart={x:e.offsetX,y:e.offsetY};
  }
});

canvas.addEventListener('mouseup',()=>{
  if(stage===9){
    selectStep++;
    selectBoxes.forEach(b=>b.selected=false);
    if(selectStep>=selectTargets.length){
      nextStage();
    }
    draw();
  }
});

// ===== SUMMARY =====
function showSummary(){
  canvas.style.display='none';
  document.getElementById('info').style.display='none';
  document.getElementById('summary').style.display='block';
  const tb=document.getElementById('summaryBody');
  summary.forEach(s=>{
    tb.innerHTML+=`<tr><td>${s.stage}</td><td>${s.time}s</td></tr>`;
  });
}

// INIT
target=randPos();
startTimer();
draw();
</script>
</body>
</html>
