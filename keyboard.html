
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Menggunakan Keyboard</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    #info {
      background-color: #f8f9fa;
      padding: 10px;
      font-size: 18px;
      border-bottom: 1px solid #ccc;
    }

    #gameArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
    }

    input {
      margin: 20px 0;
      font-size: 24px;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
      display: none;
    }

    #targetDisplay {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #textBox {
      margin-top: 20px;
      font-size: 24px;
      border: 2px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      text-align: center;
      background-color: #f8f8f8;
      display: none;
    }
#arrowGridContainer{
  margin-top:20px;
  display:flex;
  justify-content:center;
}

.arrowGrid{
  display:grid;
  grid-template-columns: repeat(5, 50px);
  grid-template-rows: repeat(5, 50px);
  gap:6px;
}

.arrowCell{
  width:50px;
  height:50px;
  border:1px solid #999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.arrowActive{
  background:#3498db;
  color:white;
  font-weight:bold;
}

    
  </style>
</head>
<body>
  <div id="info">
    <div style="margin-top:8px;">
  Lompat ke Stage:
  <select id="stageSelector">
    <option value="1">1 – Random Key</option>
    <option value="2">2 – Kombinasi</option>
    <option value="3">3 – Shift</option>
    <option value="4">4 – Backspace</option>
    <option value="5">5 – Multi Text</option>
    <option value="6">6 – Arrow Navigation</option>
    <option value="7">7 – TAB Navigation</option>
  </select>
  <button id="goStage">Mulai</button>
</div>

    <div>Stage: <span id="stage">1</span></div>
    <div>Task: <span id="taskDescription"></span></div>
    <a href="/#!/login">KLIK INI UNTUK KEMBALI KE BERANDA</a>
  </div>
  <div id="gameArea">
    <div id="targetDisplay"></div>
    <div id="arrowGridContainer"></div>
    <input type="text" id="inputBox">
    <input type="text" id="input1" placeholder="KOTAK TEKS 1">
    <input type="text" id="input2" placeholder="KOTAK TEKS 2">
    <input type="text" id="input3" placeholder="KOTAK TEKS 3">
    <input type="text" id="input4" placeholder="KOTAK TEKS 4">

    
  </div>
  <script>
document.getElementById("goStage").onclick = () => {
  const s = parseInt(document.getElementById("stageSelector").value);
  jumpToStage(s);
};

function jumpToStage(s){
  stage = s;
  currentTask = 0;
  stageElement.textContent = stage;

  // bersihkan semua tampilan
  hideArrowGrid();
  inputBox.style.display="none";
  input1.style.display="none";
  input2.style.display="none";
  input3.style.display="none";
  input4.style.display="none";
  document.body.style.cursor="default";

  switch(stage){
    case 1:
      taskDescription.textContent = "Tekan tombol huruf atau angka.";
      prepareRandomKeyTask();
      break;
    case 2:
      taskDescription.textContent = "Ketik kombinasi huruf tertentu lalu tekan Enter.";
      prepareTypingCombinationTask();
      break;
    case 3:
      taskDescription.textContent = "Ketik huruf kapital dengan Shift.";
      prepareShiftKeyTask();
      break;
    case 4:
      taskDescription.textContent = "Hapus karakter tertentu lalu tekan Enter.";
      prepareBackspaceTask();
      break;
    case 5:
      taskDescription.textContent = "Isi kotak teks tertentu dengan kombinasi.";
      prepareMultiTextCombinationTask();
      break;
    case 6:
      taskDescription.textContent = "Gunakan panah keyboard menuju huruf target.";
      prepareArrowStage();
      break;
    case 7:
      taskDescription.textContent = "Gunakan TAB untuk navigasi antar kotak.";
      prepareTabNavigation();
      break;
  }
}



    
    const stageElement = document.getElementById("stage");
    const taskDescription = document.getElementById("taskDescription");
    const targetDisplay = document.getElementById("targetDisplay");
    const inputBox = document.getElementById("inputBox");
    const input1 = document.getElementById("input1");
    const input2 = document.getElementById("input2");
    const input3 = document.getElementById("input3");
    const input4 = document.getElementById("input4");

    let stage = 1;
    let currentTask = 0;
    let targetChar = "";
    let targetString = "";
    let attempts = 0;

    // ===== STAGE 6 (Arrow) =====
  let arrowGrid = [];
  let arrowX = 0;
  let arrowY = 0;
  let arrowTargetX = 0;
  let arrowTargetY = 0;


// ===== STAGE 7 (Tab) =====
let tabTargetBox = 1;
let tabTargetText = "";

    function getRandomChar() {
      const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function getRandomCharUpperLower() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function getRandomAlphabet() {
      const chars = "abcdefghijklmnopqrstuvwxyz";
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function getRandomCharOfAString(str) {
        const randomIndex = Math.floor(Math.random() * str.length);
        return str[randomIndex];
    }

    function removeSpecificChar(str, charToRemove) {
        return str.split(charToRemove).join('');
    }



    function getRandomString(length = 10) {
      let str = "";
      for (let i = 0; i < length; i++) {
        str += getRandomChar();
      }
      return str;
    }

    function getRandomStringUpperLower(length = 10) {
      let str = "";
      for (let i = 0; i < length; i++) {
        str += getRandomCharUpperLower();
      }
      return str;
    }

    function getRandomUniqueString(length = 10) {
        const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
        if (length > chars.length) {
            throw new Error("Requested length exceeds the number of unique characters available.");
        }
        
        // Convert the string to an array and shuffle it
        const shuffledChars = chars.split('').sort(() => Math.random() - 0.5);
        
        // Take the first `length` characters
        return shuffledChars.slice(0, length).join('');
    }

    function nextStage() {
      stage++;
      currentTask = 0;
      stageElement.textContent = stage;

      switch (stage) {
        case 2:
          taskDescription.textContent = "Ketik kombinasi huruf tertentu. Lalu tekan tombol Enter";
          prepareTypingCombinationTask();
          break;
        case 3:
          taskDescription.textContent = "Ketik huruf kapital dengan Shift.";
          prepareShiftKeyTask();
          break;
        case 4:
          taskDescription.textContent = "Hapus suatu karakter pada isian teks box";
          prepareBackspaceTask();
          break;
        case 5:
            taskDescription.textContent = "Isi salah satu kotak teks dengan kombinasi karakter tertentu"
            prepareMultiTextCombinationTask();
            break;
        case 6:
          taskDescription.textContent = "Gunakan tombol panah (← ↑ → ↓) untuk menuju huruf target. Mouse tidak boleh digunakan.";
          prepareArrowStage();
          break;

        
        case 7:
          taskDescription.textContent = "Gunakan TAB dan SHIFT+TAB untuk menuju kotak yang diminta. Mouse tidak boleh digunakan.";
          prepareTabNavigation();
          break;

        default:
          alert("Selamat! Anda telah menyelesaikan semua tahap.");
          resetGame();
          break;
      }
    }

    function resetGame() {
      stage = 1;
      currentTask = 0;
      stageElement.textContent = stage;
      taskDescription.textContent = "Tekan tombol huruf atau angka.";
      prepareRandomKeyTask();
    }

    function prepareRandomKeyTask() {
      targetChar = getRandomChar();
      targetDisplay.textContent = `Tekan tombol: ${targetChar.toUpperCase()}`;
      inputBox.style.display = "none"; // Sembunyikan textbox
      input1.style.display = "none";
      input2.style.display = "none";
      input3.style.display = "none";
      input4.style.display = "none";
    }

    function prepareTypingCombinationTask() {
      targetString = getRandomString();
      targetDisplay.textContent = `Klik kotak teks berikut, Ketik: ${targetString}, lalu tekan Enter`;
      inputBox.style.display = "block"; // Tampilkan textbox
      inputBox.value = "";
    }

    function prepareShiftKeyTask() {
      targetChar = getRandomAlphabet();
      targetDisplay.textContent = `Tekan tombol SHIFT dan ${targetChar.toUpperCase()} berbarengan untuk membuat huruf kapital ${targetChar.toUpperCase()}`;
      inputBox.style.display = "none"; // Sembunyikan textbox
    }

    function prepareBackspaceTask() {
      text = getRandomUniqueString();
      toDelete = getRandomCharOfAString(text);
      targetDisplay.textContent = `Hapus karakter: ${toDelete} pada kotak teks, lalu Tekan Enter`;
      inputBox.value = text;
      inputBox.style.display = "block"; // Tampilkan kotak teks
    }

    function prepareMultiTextCombinationTask() {
        inputBox.style.display = "none";
        input1.style.display = "block";
        input2.style.display = "block";
        input3.style.display = "block";
        input4.style.display = "block";

        randomTextBox = Math.floor(Math.random() * 4) + 1;
        targetString = getRandomStringUpperLower();
        targetDisplay.textContent = `Klik kotak teks ${randomTextBox}, ketik ${targetString} lalu tekan Enter`;

        input1.value = "";
        input2.value = "";
        input3.value = "";
        input4.value = ""; 

    }

    // =======================
// STAGE 6 — Arrow Navigation
// =======================
function prepareArrowStage(){
  const c = document.getElementById("arrowGridContainer");
  c.style.display = "flex";
  c.innerHTML = "";

  document.body.style.cursor="not-allowed";

  inputBox.style.display="none";
  input1.style.display="none";
  input2.style.display="none";
  input3.style.display="none";
  input4.style.display="none";

  arrowGrid = [];
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for(let y=0;y<5;y++){
    const row=[];
    for(let x=0;x<5;x++){
      row.push(chars[Math.floor(Math.random()*chars.length)]);
    }
    arrowGrid.push(row);
  }

  arrowX = 0;
  arrowY = 0;

  arrowTargetX = Math.floor(Math.random()*5);
  arrowTargetY = Math.floor(Math.random()*5);

  drawArrowGrid();
  updateArrowInstruction();   // ← ini wajib
}






// =======================
// STAGE 7 — TAB Navigation
// =======================
function prepareTabNavigation(){
  hideArrowGrid();

  input1.style.display="block";
  input2.style.display="block";
  input3.style.display="block";
  input4.style.display="block";

  input1.value="";
  input2.value="";
  input3.value="";
  input4.value="";

  // lock mouse
  [input1,input2,input3,input4].forEach(i=>{
    i.style.pointerEvents="none";
    i.blur();
  });

  document.body.style.cursor="not-allowed";

  tabIndex = 0;
  targetTabIndex = Math.floor(Math.random()*4);
  tabTargetText = getRandomStringUpperLower(6);

  targetDisplay.textContent =
    `Gunakan TAB / SHIFT+TAB sampai fokus berada di kotak ${targetTabIndex+1}, ketik: ${tabTargetText}, lalu tekan ENTER`;

  input1.focus();
}


function drawArrowGrid(){
  const container = document.getElementById("arrowGridContainer");
  container.innerHTML = `<div class="arrowGrid"></div>`;
  const grid = container.querySelector(".arrowGrid");

  for(let y=0;y<5;y++){
    for(let x=0;x<5;x++){
      const cell = document.createElement("div");
      cell.className = "arrowCell";
      if(x===arrowX && y===arrowY){
        cell.classList.add("arrowActive");
      }
      cell.innerText = arrowGrid[y][x];
      grid.appendChild(cell);
    }
  }
}
function hideArrowGrid(){
  const c = document.getElementById("arrowGridContainer");
  c.innerHTML = "";
  c.style.display = "none";
}

function updateArrowInstruction(){
  const letter = arrowGrid[arrowTargetY][arrowTargetX];
  targetDisplay.textContent =
    `Gunakan panah (← ↑ → ↓) menuju huruf: ${letter}, lalu tekan ENTER`;
}




    document.addEventListener("keydown", (event) => {
      if (stage === 1) {
        // Tahap 1: Tekan tombol huruf/angka
        if (event.key.toLowerCase() === targetChar.toLowerCase()) {
          currentTask++;
          if (currentTask < 25) {
            prepareRandomKeyTask();
          } else {
            nextStage();
          }
        }
      } else if (stage === 2) {
        // Tahap 2: Ketik kombinasi huruf
        if (inputBox.value === targetString) {
          currentTask++;
          if (currentTask < 5) {
            prepareTypingCombinationTask();
          } else {
            nextStage();
          }
        }
      } else if (stage === 3) {
        // Tahap 3: Ketik huruf kapital
        if (event.key === targetChar.toUpperCase() && event.shiftKey) {
          currentTask++;
          if (currentTask < 25) {
            prepareShiftKeyTask();
          } else {
            nextStage();
          }
        }
      } else if (stage === 4) {
        if (inputBox.value === removeSpecificChar(text, toDelete)) {
          currentTask++;
          if (currentTask < 5) {
            prepareBackspaceTask();
          } else {
            nextStage();
          }
        } else {
            if(event.key === "Enter") {
                inputBox.value = text;
            }
        } 
    } else if(stage === 5) {
        if(document.getElementById("input" + randomTextBox).value === targetString) {
          currentTask++;
          if (currentTask < 5) {
            prepareMultiTextCombinationTask();
          } else {
            nextStage();
          }
        } else {
            if(event.key === "Enter") {
                
            }
        }
            
    }}else if(stage===6){

  if(event.key==="ArrowUp" && arrowY>0) arrowY--;
  if(event.key==="ArrowDown" && arrowY<4) arrowY++;
  if(event.key==="ArrowLeft" && arrowX>0) arrowX--;
  if(event.key==="ArrowRight" && arrowX<4) arrowX++;

  if(event.key.startsWith("Arrow")){
    drawArrowGrid();
  }

  if(event.key==="Enter"){
    // hanya sah kalau tepat di target
    if(arrowX === arrowTargetX && arrowY === arrowTargetY){
      currentTask++;

      if(currentTask < 8){
        arrowTargetX = Math.floor(Math.random()*5);
        arrowTargetY = Math.floor(Math.random()*5);
        arrowX = 0;
        arrowY = 0;
        drawArrowGrid();
        updateArrowInstruction();
      }else{
        document.body.style.cursor="default";
        nextStage();
      }
    }
  }
}

 else if(stage===7){
  if(event.key==="Tab"){
    event.preventDefault();

    if(event.shiftKey){
      tabIndex = (tabIndex + 3) % 4;
    }else{
      tabIndex = (tabIndex + 1) % 4;
    }

    [input1,input2,input3,input4][tabIndex].focus();
  }

  if(event.key==="Enter"){
    const boxes = [input1,input2,input3,input4];

    if(
      tabIndex === targetTabIndex &&
      boxes[tabIndex].value === tabTargetText
    ){
      currentTask++;
      if(currentTask < 8){
        prepareTabNavigation();
      }else{
        document.body.style.cursor="default";
        boxes.forEach(i=>{
          i.style.pointerEvents="auto";
        });
        nextStage();
      }
    }
  }
}

  });

    // Mulai permainan
    resetGame();
  </script>
</body>
</html>
