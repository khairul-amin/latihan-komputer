<div class="row mt-3">

  <!-- PANEL KIRI -->
  <div class="col-md-3">
    <div class="card mb-3">
      <div class="card-body">
        <h5>Sisa Waktu</h5>
        <h3 class="text-danger">{{ menit }}:{{ detik | number:2 }}</h3>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h6>Navigasi Soal</h6>

        <button
          class="btn btn-sm m-1"
          ng-repeat="s in soal track by $index"
          ng-class="jawaban[$index] ? 'btn-success' : 'btn-outline-secondary'"
          ng-click="go($index)">
          {{ $index + 1 }}
        </button>
      </div>
    </div>
  </div>

  <!-- PANEL KANAN -->
  <div class="col-md-9">
    <div class="card">
      <div class="card-body">

        <h5>Soal {{ index + 1 }}</h5>
        <p>{{ soal[index].tanya }}</p>

        <div class="form-check" ng-repeat="o in soal[index].opsi">
          <input
            class="form-check-input"
            type="radio"
            name="opsi"
            ng-model="jawaban[index]"
            ng-value="o">
          <label class="form-check-label">
            {{ o }}
          </label>
        </div>

        <hr>

        <button
          class="btn btn-secondary"
          ng-disabled="index === 0"
          ng-click="prev()">
          Sebelumnya
        </button>

        <button
          class="btn btn-secondary"
          ng-disabled="index === soal.length - 1"
          ng-click="next()">
          Berikutnya
        </button>

        <button
          class="btn btn-danger float-end"
          ng-click="selesai()">
          Selesai Ujian
        </button>

      </div>
    </div>
  </div>

</div>
